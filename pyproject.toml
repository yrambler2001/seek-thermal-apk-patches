[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seek-patch"
dynamic = ["version"]
description = "Unofficial patches for the Seek Thermal Android app: full camera frame rate, iOS-like sharp scaling, a working smoothing switch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yurii Synyshyn" }]
requires-python = ">=3.9"
keywords = ["seek thermal", "thermal camera", "android", "apktool", "smali", "patch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.17.2"]
measure = ["numpy>=1.22", "pillow>=9"]

[project.scripts]
seek-patch = "seekpatch.cli:main"

[tool.setuptools.dynamic]
version = { attr = "seekpatch.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"seekpatch.helpers" = ["*.smali"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
